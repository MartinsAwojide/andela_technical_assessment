[project]
name = "meridian-support-bot"
version = "0.1.0"
description = "Meridian Electronics customer support chatbot"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.3.18",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.10",
    "langchain-google-genai>=2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "gradio>=5.22.0",
    # HF Spaces installs gradio[mcp,oauth]; mcp extra requires pydantic<=2.12.5 (conflicts with 2.13.x).
    "pydantic>=2.11.10,<=2.12.5",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
